<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type Tester</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="tester">A</div>

    <button onclick="changeLetter('A')">A</button>
    <button onclick="changeLetter('B')">B</button>
    <button onclick="changeLetter('C')">C</button>
    <button onclick="changeLetter('D')">D</button>
    <button onclick="changeLetter('E')">E</button>
    <button onclick="changeLetter('F')">F</button>
    <button onclick="changeLetter('G')">G</button>

    <br>

    <button onclick="changeFontSize(-5)">Decrease font size</button>
    <button onclick="changeFontSize(5)">Increase font size</button>

    <br>

    <button onclick="changeColor('#F4C2D7')">Pink</button>
    <button onclick="changeColor('#D8C7EF')">Lavender</button>
    <button onclick="changeColor('#FFFFFF')">White</button>
    <button onclick="changeColor('#A8B87C')">Matcha</button>

    <script src="script.js"></script>

</body>
</html>
